<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orbit MIDI — playable build</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #000; outline: none; }
      #loading {
        position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; color: #f2f0ea; font: 13px/1.4 'IBM Plex Mono', ui-monospace, monospace; background: #071827;
      }
      #bar { width: 240px; height: 2px; background: rgba(242,240,234,.16); }
      #fill { width: 0; height: 100%; background: #e0644a; transition: width .2s; }
      #err { color: #e0644a; max-width: 80%; text-align: center; }
      #fs {
        position: absolute; right: 10px; bottom: 10px; display: none; cursor: pointer;
        background: rgba(7,24,39,.7); color: #f2f0ea; border: 1px solid rgba(242,240,234,.5); border-radius: 999px;
        font: 12px 'IBM Plex Mono', ui-monospace, monospace; padding: 4px 12px;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading"><span>&gt; loading game…</span><div id="bar"><div id="fill"></div></div><span id="err"></span></div>
    <button id="fs" type="button">⤢ fullscreen</button>
    <script>
      // Safari (and some other browsers) have no Web MIDI. The game's MIDI plugin calls it
      // anyway and crashes, so give it a stand-in that reports "no MIDI devices".
      // The game then runs on the keyboard.
      if (typeof navigator.requestMIDIAccess !== 'function') {
        navigator.requestMIDIAccess = function () {
          return Promise.resolve({
            inputs: new Map(), outputs: new Map(), sysexEnabled: false, onstatechange: null,
            addEventListener: function () {}, removeEventListener: function () {},
          });
        };
        window.__noWebMIDI = true;
      }
    </script>
    <script>
      // Unity WebGL build, gzip with decompression fallback (.unityweb): works on any server.
      // Uses Web MIDI (Chrome / Edge) — the parent iframe must allow "midi".
      var build = 'Build/OrbitWeb';
      var config = {
        dataUrl: build + '.data.unityweb',
        frameworkUrl: build + '.framework.js.unityweb',
        codeUrl: build + '.wasm.unityweb',
        streamingAssetsUrl: 'StreamingAssets',
        companyName: 'DefaultCompany',
        productName: 'Orbit',
        productVersion: '0.1.0',
        showBanner: function (msg, type) { if (type === 'error') document.getElementById('err').textContent = msg; },
      };
      var s = document.createElement('script');
      s.src = build + '.loader.js';
      s.onload = function () {
        createUnityInstance(document.getElementById('unity-canvas'), config, function (p) {
          document.getElementById('fill').style.width = 100 * p + '%';
        }).then(function (unity) {
          document.getElementById('loading').style.display = 'none';
          var fs = document.getElementById('fs');
          fs.style.display = 'block';
          fs.onclick = function () { unity.SetFullscreen(1); };
          document.getElementById('unity-canvas').focus();
        }).catch(function (m) {
          document.getElementById('err').textContent = String(m);
        });
      };
      document.body.appendChild(s);
    </script>
  </body>
</html>
